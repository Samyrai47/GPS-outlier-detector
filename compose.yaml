services:
  app:
    build: .
    container_name: outlier-detector
    ports:
      - "8081:8080"
    environment:
      APP_PYTHON_EXECUTABLE: /app/venv/bin/python
      APP_PYTHON_SCRIPT_PATH: /app/python/detector.py
      APP_ANALYSIS_WORKDIR: /app/workdir
    volumes:
      - app_workdir:/app/workdir

volumes:
  app_workdir: